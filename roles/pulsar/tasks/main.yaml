---
- name: Include prepare tasks
  ansible.builtin.include_tasks: "{{ ansible_distribution_file_variety | lower }}/{{
    pulsar_install_type }}/03-prepare.yaml"
  when: '"prepare" in pulsar_steps'

- name: Include install tasks
  ansible.builtin.include_tasks: "{{ ansible_distribution_file_variety | lower }}/{{
    pulsar_install_type }}/06-install.yaml"
  when: '"install" in pulsar_steps'

- name: Include configure tasks
  ansible.builtin.include_tasks: "{{ ansible_distribution_file_variety | lower }}/{{
    pulsar_install_type }}/09-configure.yaml"
  when: '"configure" in pulsar_steps'

- name: Include post_check tasks
  ansible.builtin.include_tasks: "{{ ansible_distribution_file_variety | lower }}/{{
    pulsar_install_type }}/15-post_check.yaml"
  when: '"post_check" in pulsar_steps'
